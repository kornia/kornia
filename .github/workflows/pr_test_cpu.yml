name: Tests on CPU (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether code tests are needed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --no-renames --name-only "${BASE_SHA}...HEAD")
          if grep -Eqv '^(docs/|.*\.md$|LICENSE$|COPYRIGHT$)' <<< "$changed"; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            # Must stay the first command here: it captures the `if` condition's
            # exit status (1 = docs-only, anything else = grep itself failed).
            grep_status=$?
            if [[ "$grep_status" -eq 1 ]]; then
              echo "run-tests=false" >> "$GITHUB_OUTPUT"
            else
              exit "$grep_status"
            fi
          fi

  pre-tests:
    needs: [changes]
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hashid.outputs.weights-hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.40.0
          cache: true

      - uses: actions/cache@v6
        id: cache-weights
        with:
          path: weights/
          key: model-weights-${{ hashFiles('.github/download-models-weights.py') }}
          enableCrossOsArchive: true

      - name: Download models weights...
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: pixi run uv run python .github/download-models-weights.py -t weights/

      - name: write hashid
        id: hashid
        run: echo "weights-hash=${{ hashFiles('.github/download-models-weights.py') }}" >> "$GITHUB_OUTPUT"

  tests:
    needs: [pre-tests]
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        pytorch-dtype: ["float32", "float64"]
        python-version: ["3.11", "3.12", "3.13"]
        pytorch-version: ["2.5.1", "2.14.0"]
        exclude:
          # PyTorch 2.5.1 doesn't have wheels for Python 3.13 on Windows
          - os: windows-latest
            python-version: "3.13"
            pytorch-version: "2.5.1"
          # PyTorch 2.5.1 doesn't have wheels for Python 3.13 on macOS
          - os: macos-latest
            python-version: "3.13"
            pytorch-version: "2.5.1"
          # macOS only runs float32 tests
          - os: macos-latest
            pytorch-dtype: "float64"
          # torch 2.5.1 wheels crash with STATUS_ILLEGAL_INSTRUCTION (0xc000001d) in
          # affine_grid on the windows-2025 runner image (now rolling out as
          # windows-latest); run those legs on windows-2022 via `include` below.
          - os: windows-latest
            pytorch-version: "2.5.1"
        include:
          - os: windows-2022
            pytorch-dtype: "float32"
            python-version: "3.11"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float64"
            python-version: "3.11"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float32"
            python-version: "3.12"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float64"
            python-version: "3.12"
            pytorch-version: "2.5.1"

    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: '["${{ matrix.python-version }}"]'
      pytorch-version: '["${{ matrix.pytorch-version }}"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  half-precision:
    needs: [pre-tests]
    strategy:
      fail-fast: false
      matrix:
        pytorch-dtype: ["float16", "bfloat16"]
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      python-version: '["3.11"]'
      pytorch-version: '["2.9.1"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      known-failure-profile: cpu-${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  # Runs only the torch.compile / dynamo tests under the inductor backend, which the main
  # `tests` matrix deselects (KORNIA_TEST_OPTIMIZER=""). Keeps the compile-clean core a
  # defended floor at PR time. Scoped to a single config and `-k dynamo or compile` so the
  # extra CI cost is small (only the compile-marked tests actually build inductor graphs).
  dynamo:
    needs: [pre-tests]
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      python-version: '["3.11"]'
      pytorch-version: '["2.14.0"]'
      pytorch-dtype: float32
      optimizer: inductor
      pytest-extra: 'tests/augmentation tests/enhance tests/filters tests/color tests/geometry tests/losses tests/morphology -k "dynamo or compile"'
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  # Single blocking MPS leg: newest Python, float32, on an Apple-silicon image.
  # The exact known-failure baseline is pinned as strict xfails (see #4159): a new failure,
  # changed failure, skipped pin, or fixed pin makes the job red and requires review. The
  # torch pin tracks the newest pin of the CPU matrix so the leg resolves the locked
  # dependency set; changing it means re-recording the manifest in the same change, because
  # a release that adds MPS kernels turns recorded failures into strict XPASSes.
  #
  # The image is pinned to macos-15 rather than macos-latest, and that is not cosmetic.
  # macos-latest is macos-26-arm64, whose GPU is paravirtualized; on macOS 26 torch 2.14
  # emits Metal 4 `mpp::tensor_ops::matmul2d` cooperative-tensor shaders, and that virtual
  # GPU cannot compile them. One shader specialization (matmul2d_descriptor<64,64,-1>) took
  # 664 tests down across every subpackage -- `linalg.inv`, `linalg.solve`, `inv_ex`,
  # `lu_factor_ex` and `F.conv3d` all route through it -- where the same runner on torch
  # 2.9.1 had 200 failures. The blocker is the *virtual* GPU and not macOS 26: a physical M1
  # on macOS 26.5 compiles those shaders and produces the same 14 failures this leg records.
  # The macOS 15 image is Metal 3 and takes the older kernel path, which is the path that
  # works on the runner fleet. Two consequences: no job here exercises the Metal 4 path that
  # users on current macOS run, and when GitHub retires macos-15 this leg stops scheduling
  # and `collector` goes red with no fallback -- so re-test macos-latest once upstream guards
  # those kernels by device capability, rather than waiting for the image to be retired.
  # Measured in https://github.com/kornia/kornia/issues/4159#issuecomment-5532655834.
  # macos-14 segfaults inside MPS kernels and must not be used.
  tests-mps:
    needs: [pre-tests]
    uses: ./.github/workflows/tests.yml
    with:
      os: macos-15
      python-version: '["3.13"]'
      pytorch-version: '["2.14.0"]'
      pytorch-dtype: float32
      device: mps
      pytest-extra: --xfail-known-failures
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  typecheck:
    needs: [pre-tests]
    uses: ./.github/workflows/typecheck.yml

  tutorials:
    needs: [pre-tests]
    uses: ./.github/workflows/tutorials.yml

  collector:
    needs: [changes, pre-tests, tests, tests-mps, half-precision, dynamo, typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo job failed && exit 1
