name: LightGlue Windows investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        torch: ["2.5.1"]
    defaults:
      run:
        shell: bash
    env:
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Select environment
        id: env
        run: echo "name=py$(echo '${{ matrix.python }}' | tr -d '.')" >> "$GITHUB_OUTPUT"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.40.0
          environments: ${{ steps.env.outputs.name }}
      - run: pixi run -e ${{ steps.env.outputs.name }} install
      - run: pixi run -e ${{ steps.env.outputs.name }} uv run --no-sync uv pip install --reinstall-package torch --index-url https://download.pytorch.org/whl/cpu torch==${{ matrix.torch }}
      - name: Baseline regression tests on the same runner
        continue-on-error: true
        run: |
          git show 542752eff:kornia/feature/lightglue.py > kornia/feature/lightglue.py
          pixi run -e ${{ steps.env.outputs.name }} uv run --no-sync pytest tests/feature/test_lightglue.py::TestLightGluePruningDtype tests/feature/test_lightglue.py::TestLightGlueBatchedPairs --device=cpu --dtype=float64 -q
      - name: Restore and validate the fix
        if: always()
        env:
          KORNIA_TEST_OPTIMIZER: eager
        run: |
          git restore kornia/feature/lightglue.py
          pixi run -e ${{ steps.env.outputs.name }} uv run --no-sync pytest tests/feature/test_lightglue.py::TestAttention tests/feature/test_lightglue.py::TestLightGluePruningDtype tests/feature/test_lightglue.py::TestLightGlueBatchedPairs --device=cpu --dtype=float32,float64 -q
      - name: Trace first nonfinite value and compare attention backends
        run: |
          pixi run -e ${{ steps.env.outputs.name }} uv run --no-sync python - <<'PYCODE'
          """Run from the Kornia checkout as stdin (python - < /tmp/.../probe.py)."""
          import contextlib
          import sys
          from unittest.mock import patch

          import torch
          import torch.nn.functional as F
          from torch.nn.attention import SDPBackend, sdpa_kernel

          import kornia
          from tests.feature.test_lightglue import TestLightGluePruningDtype


          def tensors(value):
              if isinstance(value, torch.Tensor):
                  yield value
              elif isinstance(value, (tuple, list)):
                  for item in value:
                      yield from tensors(item)


          def stats(value):
              return [
                  {
                      "shape": tuple(t.shape),
                      "dtype": str(t.dtype),
                      "finite": bool(t.isfinite().all()),
                      "min": t.min().item() if t.numel() else None,
                      "max": t.max().item() if t.numel() else None,
                  }
                  for t in tensors(value)
              ]


          print("python", sys.version.split()[0], "torch", torch.__version__)
          print("kornia", kornia.__file__, "threads", torch.get_num_threads())
          print(torch.__config__.show())
          original_sdpa = F.scaled_dot_product_attention
          fixture = TestLightGluePruningDtype()
          device = torch.device("cpu")
          for dtype in (torch.float32, torch.float64):
              for backend in ("default", "math"):
                  print("\nCASE", dtype, backend, flush=True)
                  model = fixture._model(device, dtype)
                  data, _ = fixture._scene(device, dtype)
                  first_bad = []

                  def hook(name):
                      def inspect(module, args, output):
                          bad = any(not bool(t.isfinite().all()) for t in tensors(output))
                          if bad and not first_bad:
                              first_bad.append(name)
                              print("FIRST NONFINITE", name, "input", stats(args), "output", stats(output), flush=True)
                          if name == "token_confidence.0":
                              print("TOKENS", [t.tolist() for t in tensors(output)], flush=True)
                      return inspect

                  for name, module in model.named_modules():
                      module.register_forward_hook(hook(name))

                  def traced_sdpa(q, k, v, *args, **kwargs):
                      output = original_sdpa(q, k, v, *args, **kwargs)
                      with sdpa_kernel([SDPBackend.MATH]):
                          reference = original_sdpa(q, k, v, *args, **kwargs)
                      print("SDPA", "inputs", stats((q, k, v)), "output", stats(output),
                            "math_finite", bool(reference.isfinite().all()),
                            "math_max_diff", (output - reference).abs().max().item(), flush=True)
                      return output

                  # Enter after construction: Attention.__init__ changes the global flash flag.
                  context = sdpa_kernel([SDPBackend.MATH]) if backend == "math" else contextlib.nullcontext()
                  with context, patch.object(F, "scaled_dot_product_attention", traced_sdpa):
                      output = fixture._forward(model, data)
                  print("RESULT", "first_bad", first_bad, "stop", output["stop"],
                        "prune0", output["prune0"].tolist(), "prune1", output["prune1"].tolist(),
                        "scores", stats(output["matching_scores0"]), flush=True)
          PYCODE
      - name: Minimal CPU flash reproduction
        run: |
          pixi run -e ${{ steps.env.outputs.name }} uv run --no-sync python - <<'PYCODE'
          import torch
          import torch.nn.functional as F
          from torch.nn.attention import SDPBackend, sdpa_kernel
          for dtype in (torch.float32, torch.float64):
              for shape in ((1, 4, 16, 64), (1, 2, 5, 8)):
                  for pattern in ("random", "constant"):
                      torch.manual_seed(0)
                      q, k, v = [torch.randn(shape, dtype=dtype) for _ in range(3)]
                      if pattern == "constant":
                          q.zero_()
                          k.zero_()
                          v.fill_(1)
                      with sdpa_kernel([SDPBackend.MATH]):
                          ref = F.scaled_dot_product_attention(q, k, v)
                      with sdpa_kernel([SDPBackend.FLASH_ATTENTION]):
                          out = F.scaled_dot_product_attention(q, k, v)
                      print("PRIMITIVE", torch.__version__, dtype, shape, pattern,
                            "finite", bool(out.isfinite().all()), "max_diff", (out-ref).abs().max().item(), flush=True)
          PYCODE
