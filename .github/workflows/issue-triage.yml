name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Triage New Issue
    runs-on: ubuntu-latest
    steps:
      - name: Triage new issue
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.issue.user.login;

            // Maintainers triage issues they open without the automated label.
            let isMaintainer = false;
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author
              });
              isMaintainer = ['admin', 'maintain', 'write'].includes(perm.permission);
            } catch (error) {
              core.warning(`Could not determine permission for @${author}: ${error.message}`);
            }

            if (isMaintainer) {
              core.info(`@${author} has write access or above; skipping automated triage.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triage']
            });
