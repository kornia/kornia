name: Changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares the PR to its merge base, rather than the moving main tip.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check fragment names and PR entry
        env:
          BASE_REF: origin/${{ github.base_ref }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--base-ref "$BASE_REF" --pr-number "$PR_NUMBER")
          if [[ "$NO_CHANGELOG" == "true" ]]; then
            args+=(--skip-presence)
          fi
          python3 .github/scripts/check_changelog.py "${args[@]}"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.40.0
          cache: true

      - name: Build draft release notes
        run: pixi run changelog-preview
