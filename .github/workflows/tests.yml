on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'
      pytorch-version:
        required: false
        type: string
        default: '["2.14.0"]'
      torch-channel:
        # "pinned" (default) installs exactly the pytorch-version matrix value, byte-identical
        # to prior behavior. "stable" ignores pytorch-version for the install step itself and
        # upgrades to whatever `torch` resolves to today from the stable CPU wheel index;
        # pytorch-version is still passed through and used only as a floor the resolved
        # version must be >= to. Used by the weekly upstream-probe workflow.
        required: false
        type: string
        default: pinned
      os:
        required: false
        type: string
        default: ubuntu-latest
      pytorch-dtype:
        required: false
        type: string
        default: float32
      device:
        # KORNIA_TEST_DEVICE for the run: cpu (default) or mps. An mps leg must run on an
        # Apple-silicon macOS runner; the "Verify MPS device" step below refuses to let it
        # pass by skipping every test when the runner does not expose Metal.
        required: false
        type: string
        default: cpu
      pytest-extra:
        required: false
        type: string
        default: ""
      known-failure-profile:
        required: false
        type: string
        default: ""
      known-failure-mode:
        # "verify" (default) runs the blocking --verify-known-failures gate against the
        # checked-in manifest, byte-identical to prior behavior. "record" runs
        # --record-known-failures instead, writing a candidate manifest under
        # candidate-manifests/<profile>.txt (untracked) and publishing its regeneration
        # receipt to the job summary plus a workflow artifact. Only meaningful together
        # with known-failure-profile; used by the weekly upstream-probe workflow.
        required: false
        type: string
        default: verify
      optimizer:
        required: false
        type: string
        default: ""
      fail-fast:
        required: false
        type: boolean
        default: false
      runslow:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ${{ github.sha }}
      cache-path:
        required: false
        type: string
      cache-key:
        required: false
        type: string
      cache-restore-keys:
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-version) }}
        pytorch-version: ${{ fromJSON(inputs.pytorch-version) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Restore cache
        if: inputs.cache-path != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          restore-keys: ${{ inputs.cache-restore-keys }}

      - name: Set pixi environment name
        id: pixi-env
        shell: bash
        run: echo "name=py$(echo '${{ matrix.python-version }}' | tr -d '.')" >> $GITHUB_OUTPUT

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.40.0
          cache: true
          environments: ${{ steps.pixi-env.outputs.name }}

      - name: Install dependencies
        run: pixi run -e ${{ steps.pixi-env.outputs.name }} install

      - name: Install the matrix torch and reconcile the environment
        shell: bash
        env:
          PYTORCH_VERSION: ${{ matrix.pytorch-version }}
          TORCH_CHANNEL: ${{ inputs.torch-channel }}
        run: |
          case "$TORCH_CHANNEL" in
            pinned)
              pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync uv pip install \
                --reinstall-package torch --index-url https://download.pytorch.org/whl/cpu "torch==$PYTORCH_VERSION"
              ;;
            stable)
              pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync uv pip install \
                --upgrade --index-url https://download.pytorch.org/whl/cpu torch
              ;;
            *)
              echo "unknown torch-channel: $TORCH_CHANNEL" >&2
              exit 1
              ;;
          esac

          # `uv sync` installed the lockfile's dependency set for the *locked* torch, and the swap
          # above replaced torch alone with a `+cpu` build that declares no `triton` at all, so the
          # lockfile's triton survives as an orphan of a torch that is no longer installed and torch
          # dispatches onto it by import availability rather than by version (#4199).
          # `.github/scripts/check_torch_env.py` carries the full mechanism. These legs are CPU-only
          # and never need triton, so dropping it lets torch take its non-triton path deliberately
          # instead of tripping over the wrong one.
          #
          # This runs inside the swap's own step rather than a step of its own so it cannot be
          # reordered ahead of it: against the *locked* torch -- which does declare triton -- the
          # check finds nothing stale, and #4199 would survive a green run.
          report=$(pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync \
            python .github/scripts/check_torch_env.py --list-undeclared-sidecars | tr -d '\r')
          # An empty capture would mean the parse broke, not that the venv is clean, so the
          # result line has to be there before its content is believed.
          if ! printf '%s\n' "$report" | grep -q '^undeclared-sidecars:'; then
            echo "the sidecar check reported no result; refusing to assume the venv is clean" >&2
            printf '%s\n' "$report" >&2
            exit 1
          fi
          stale=$(printf '%s\n' "$report" | sed -n 's/^undeclared-sidecars:[[:space:]]*//p' | tail -n 1)
          if [[ -n "$stale" ]]; then
            echo "Removing packages the installed torch does not declare: $stale"
            pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync uv pip uninstall $stale
          else
            echo "No stale torch sidecars to remove"
          fi

      # Assert the whole environment against the torch that was just installed, not only
      # torch.__version__: a silently mis-provisioned venv has to fail here, at setup, rather
      # than run the suite and report a wall of unrelated-looking test failures (#4199).
      - name: Verify PyTorch version
        id: torch-version
        shell: bash
        env:
          EXPECTED_PYTORCH_VERSION: ${{ matrix.pytorch-version }}
          TORCH_CHANNEL: ${{ inputs.torch-channel }}
        run: |
          # Under torch-channel: stable the matrix value is only a floor, so record what actually
          # got installed; the candidate-manifest artifact is named after it below.
          resolved=$(pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync \
            python .github/scripts/check_torch_env.py \
            --channel "$TORCH_CHANNEL" --expected "$EXPECTED_PYTORCH_VERSION" \
            | tr -d '\r' | sed -n 's/^torch-version: //p' | tail -n 1)
          # The check prints `torch-version:` only when the environment is coherent, so an
          # empty capture is a real failure signal here and not merely a broken parse. It is
          # what makes this gate blocking regardless of the shell's pipefail setting.
          if [[ -z "$resolved" ]]; then
            echo "the environment check did not report a torch version" >&2
            exit 1
          fi
          echo "torch-channel=$TORCH_CHANNEL expected=$EXPECTED_PYTORCH_VERSION resolved=$resolved"
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"

      # torch Windows wheels crash with STATUS_ILLEGAL_INSTRUCTION (0xc000001d) inside
      # affine_grid on part of the runner fleet — observed on torch 2.5.1 AND 2.9.1, on both
      # windows-2022 and windows-2025 (host-CPU-dependent: the CPU-autocast bf16 path
      # dispatches AVX512 kernels some hosts don't actually execute). Clamp both ISA
      # dispatchers to AVX2 on every Windows leg.
      - name: Clamp CPU ISA on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "ATEN_CPU_CAPABILITY=avx2" >> $GITHUB_ENV
          echo "DNNL_MAX_CPU_ISA=AVX2" >> $GITHUB_ENV

      # The `device` fixture skips every test when the requested device is missing, so an mps
      # leg on a runner without a Metal device would be green with zero tests run. Fail here
      # instead. macos-14 images segfault inside MPS kernels; macos-15 and later work.
      - name: Verify MPS device
        if: inputs.device == 'mps'
        run: |
          pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync python -c 'import torch; assert torch.backends.mps.is_available(), "MPS device not available on this runner"; x = torch.ones(2, device="mps"); assert (x + x).sum().item() == 4.0; print("MPS ok:", torch.mps.recommended_max_memory() // 2**20, "MiB recommended max memory")'

      - name: Run tests
        shell: bash
        env:
          KORNIA_TEST_DEVICE: ${{ inputs.device }}
          KORNIA_TEST_DTYPE: ${{ inputs.pytorch-dtype }}
          KORNIA_TEST_RUNSLOW: ${{ inputs.runslow }}
          KORNIA_TEST_OPTIMIZER: ${{ inputs.optimizer }}
          KNOWN_FAILURE_PROFILE: ${{ inputs.known-failure-profile }}
          KNOWN_FAILURE_MODE: ${{ inputs.known-failure-mode }}
          KORNIA_CI_PYTEST_VERBOSITY: ${{ runner.os == 'Windows' && '-v' || '' }}
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          UV_NO_SYNC: "1"
        run: |
          known_failure_args=()
          candidate_path=""
          case "$KNOWN_FAILURE_MODE" in
            record)
              if [[ -z "$KNOWN_FAILURE_PROFILE" ]]; then
                echo "known-failure-mode=record requires known-failure-profile" >&2
                exit 1
              fi
              mkdir -p candidate-manifests
              candidate_path="candidate-manifests/${KNOWN_FAILURE_PROFILE}.txt"
              known_failure_args+=(--record-known-failures "$candidate_path" "--known-failure-profile=$KNOWN_FAILURE_PROFILE")
              ;;
            verify)
              if [[ -n "$KNOWN_FAILURE_PROFILE" ]]; then
                known_failure_args+=(--verify-known-failures "--known-failure-profile=$KNOWN_FAILURE_PROFILE")
              fi
              ;;
            *)
              echo "unknown known-failure-mode: $KNOWN_FAILURE_MODE" >&2
              exit 1
              ;;
          esac
          if [[ "$KNOWN_FAILURE_MODE" == "record" ]]; then
            # A complete recording retains pytest's TESTS_FAILED status when it captured
            # ordinary failures. Accept only that expected status together with both the
            # candidate and its completion receipt; recorder aborts and harness failures
            # must still fail the job. Explicit `shell: bash` enables pipefail, so suspend
            # errexit around the pipeline long enough to inspect pytest's own status.
            set +e
            pixi run -e ${{ steps.pixi-env.outputs.name }} test \
              $KORNIA_CI_PYTEST_VERBOSITY "${known_failure_args[@]}" ${{ inputs.pytest-extra }} | tee pytest-output.log
            pipeline_status=("${PIPESTATUS[@]}")
            test_status=${pipeline_status[0]}
            tee_status=${pipeline_status[1]}
            set -e
            if [[ "$tee_status" -eq 0 && "$test_status" -le 1 && -s "$candidate_path" ]] \
                && grep -Fq "known-failure candidate complete for $KNOWN_FAILURE_PROFILE:" pytest-output.log; then
              exit 0
            fi
            if [[ "$tee_status" -ne 0 ]]; then
              exit "$tee_status"
            fi
            if [[ "$test_status" -eq 0 ]]; then
              echo "record mode finished without a complete candidate receipt" >&2
              exit 1
            fi
            exit "$test_status"
          else
            pixi run -e ${{ steps.pixi-env.outputs.name }} test \
              $KORNIA_CI_PYTEST_VERBOSITY "${known_failure_args[@]}" ${{ inputs.pytest-extra }}
          fi

      - name: Publish known-failure receipt
        if: always() && inputs.known-failure-mode == 'record' && inputs.known-failure-profile != ''
        shell: bash
        run: |
          {
            echo "### Known-failure receipt: ${{ inputs.known-failure-profile }} (torch ${{ steps.torch-version.outputs.resolved }})"
            echo '```'
            if grep -q '^known-failure candidate ABORTED' pytest-output.log 2>/dev/null; then
              grep -A 10 '^known-failure candidate ABORTED' pytest-output.log
            else
              grep -E '^(known-failure candidate complete|OLD |NEW: )' pytest-output.log 2>/dev/null \
                || echo "(no receipt line found; check the Run tests step log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate manifest
        if: always() && inputs.known-failure-mode == 'record' && inputs.known-failure-profile != ''
        uses: actions/upload-artifact@v7
        with:
          name: candidate-manifest-${{ inputs.known-failure-profile }}-${{ matrix.python-version }}-torch${{ steps.torch-version.outputs.resolved }}
          path: candidate-manifests/
          if-no-files-found: warn
