on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'
      pytorch-version:
        required: false
        type: string
        default: '["2.9.1"]'
      os:
        required: false
        type: string
        default: ubuntu-latest
      pytorch-dtype:
        required: false
        type: string
        default: float32
      pytest-extra:
        required: false
        type: string
        default: ""
      optimizer:
        required: false
        type: string
        default: ""
      fail-fast:
        required: false
        type: boolean
        default: false
      runslow:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ${{ github.sha }}
      cache-path:
        required: false
        type: string
      cache-key:
        required: false
        type: string
      cache-restore-keys:
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-version) }}
        pytorch-version: ${{ fromJSON(inputs.pytorch-version) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Restore cache
        if: inputs.cache-path != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          restore-keys: ${{ inputs.cache-restore-keys }}

      - name: Set pixi environment name
        id: pixi-env
        shell: bash
        run: echo "name=py$(echo '${{ matrix.python-version }}' | tr -d '.')" >> $GITHUB_OUTPUT

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.40.0
          cache: true
          environments: ${{ steps.pixi-env.outputs.name }}

      - name: Install dependencies
        run: pixi run -e ${{ steps.pixi-env.outputs.name }} install

      - name: Install PyTorch matrix version
        shell: bash
        env:
          PYTORCH_VERSION: ${{ matrix.pytorch-version }}
        run: |
          if [[ "$PYTORCH_VERSION" =~ ^2\.[1-4]\. ]]; then
            pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync uv pip install "numpy<2"
          fi
          pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync uv pip install \
            --reinstall-package torch --index-url https://download.pytorch.org/whl/cpu "torch==$PYTORCH_VERSION"

      - name: Verify PyTorch version
        env:
          EXPECTED_PYTORCH_VERSION: ${{ matrix.pytorch-version }}
        run: |
          pixi run -e ${{ steps.pixi-env.outputs.name }} uv run --no-sync python -c 'import os, torch; expected = os.environ["EXPECTED_PYTORCH_VERSION"]; version = torch.__version__; print(f"expected {expected}, got {version}"); assert version.startswith(expected)'

      # torch Windows wheels crash with STATUS_ILLEGAL_INSTRUCTION (0xc000001d) inside
      # affine_grid on part of the runner fleet — observed on torch 2.5.1 AND 2.9.1, on both
      # windows-2022 and windows-2025 (host-CPU-dependent: the CPU-autocast bf16 path
      # dispatches AVX512 kernels some hosts don't actually execute). Clamp both ISA
      # dispatchers to AVX2 on every Windows leg.
      - name: Clamp CPU ISA on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "ATEN_CPU_CAPABILITY=avx2" >> $GITHUB_ENV
          echo "DNNL_MAX_CPU_ISA=AVX2" >> $GITHUB_ENV

      - name: Run tests
        env:
          KORNIA_TEST_DEVICE: cpu
          KORNIA_TEST_DTYPE: ${{ inputs.pytorch-dtype }}
          KORNIA_TEST_RUNSLOW: ${{ inputs.runslow }}
          KORNIA_TEST_OPTIMIZER: ${{ inputs.optimizer }}
          UV_NO_SYNC: "1"
        run: pixi run -e ${{ steps.pixi-env.outputs.name }} test ${{ inputs.pytest-extra }}
