name: Stale

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale Pull Requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: "This pull request has been quiet for a while, so we're marking it stale to keep the queue readable. If you want to keep it open, leave a comment or push an update. Maintainers can add the `pinned` label to exempt it from the stale sweep. Otherwise it will be closed in 7 days. This is housekeeping, not a rejection, and you can reopen it whenever you want to continue."
          close-pr-message: "Closed for inactivity to keep the queue readable — this is housekeeping, not a rejection. Feel free to reopen whenever you're ready to continue."
          days-before-pr-stale: 15
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned"
          days-before-issue-stale: -1
          days-before-issue-close: -1
