name: Stale

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale Pull Requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-message: "This pull request has been quiet for 15 days, so we're marking it stale to keep the queue readable. **There is no automatic closure for inactivity.** Maintainers may close quiet pull requests at their discretion. The label is a triage signal, and it clears itself as soon as you comment or push. Maintainers can add the `pinned` label to exempt a pull request from the sweep entirely."
          days-before-pr-stale: 15
          # Never close automatically for inactivity: a quiet PR may be waiting on us.
          # Maintainers retain discretion to close it. -1 disables the bot's closing action.
          days-before-pr-close: -1
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned"
          days-before-issue-stale: -1
          days-before-issue-close: -1
