name: Tests on CPU (scheduled)

# Runs on main twice a day rather than on every push. With a push trigger each merge started the
# full matrix and the next merge cancelled it: from 2026-09-03 to 2026-09-24, 262 of 352 runs
# were cancelled, about 43,000 runner-minutes, in an org limited to 20 concurrent jobs.
on:
  schedule:
    # Off the hour: GitHub may drop queued scheduled jobs at the start of an hour, when load peaks.
    - cron: '23 0 * * *'
    - cron: '23 12 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-runner-macos-15:
    name: Pinned runner availability (macos-15)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'kornia/kornia' &&
      startsWith(github.workflow_ref, 'kornia/kornia/.github/workflows/scheduled_test_cpu.yml@')
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Confirm macos-15 runner availability
        run: echo "macos-15 runner is available"

  pinned-runner-windows-2022:
    name: Pinned runner availability (windows-2022)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'kornia/kornia' &&
      startsWith(github.workflow_ref, 'kornia/kornia/.github/workflows/scheduled_test_cpu.yml@')
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Confirm windows-2022 runner availability
        run: echo "windows-2022 runner is available"

  check-skip:
    # A scheduled run tests everything that reached main since the previous successful scheduled
    # run. It skips when main has not moved since then, or when every file changed since then is
    # documentation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The previous scheduled run's commit can be any number of commits back

      - name: Check what changed since the previous scheduled run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual and called runs always test.
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should-skip=false" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled run, will proceed with tests"
            exit 0
          fi

          # Compare against the newest successful scheduled run. A failed run may have tested
          # nothing (a pre-tests failure skips every test job), and skipping on top of a real
          # failure would turn the workflow green while main is still red; a cancelled run tested
          # nothing either. A run that skipped its tests concludes as success; its commit is still
          # a valid base, because everything before it was tested or was documentation.
          # Filtering the runs endpoint by status or branch returns an incomplete, unordered
          # page, so ask for a bounded created= window and sort here.
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          PREV_SHA=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/scheduled_test_cpu.yml/runs?event=schedule&created=>=${SINCE}&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")]
                  | sort_by(.created_at) | last | .head_sha // empty') || PREV_SHA=""

          if [[ -z "$PREV_SHA" ]] || ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            echo "should-skip=false" >> "$GITHUB_OUTPUT"
            echo "No usable previous scheduled run (got '${PREV_SHA}'), will proceed with tests"
            exit 0
          fi

          if [[ "$PREV_SHA" == "$(git rev-parse HEAD)" ]]; then
            echo "should-skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since the previous scheduled run at ${PREV_SHA}"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_SHA" HEAD)

          # Skip only if every changed file is documentation
          SHOULD_SKIP="true"
          for file in $CHANGED_FILES; do
            if [[ ! "$file" =~ ^docs/ ]] && \
               [[ ! "$file" =~ \.md$ ]] && \
               [[ "$file" != "LICENSE" ]] && \
               [[ "$file" != "COPYRIGHT" ]]; then
              SHOULD_SKIP="false"
              break
            fi
          done

          echo "should-skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "Changed since ${PREV_SHA}: $CHANGED_FILES"
          echo "Should skip: $SHOULD_SKIP"

  pre-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip == 'false'
    outputs:
      hash: ${{ steps.hashid.outputs.weights-hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.40.0
          cache: true

      - uses: actions/cache@v6
        id: cache-weights
        with:
          path: weights/
          key: model-weights-${{ hashFiles('.github/download-models-weights.py') }}
          enableCrossOsArchive: true

      - name: Download models weights...
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: pixi run uv run python .github/download-models-weights.py -t weights/

      - name: write hashid
        id: hashid
        run: echo "weights-hash=${{ hashFiles('.github/download-models-weights.py') }}" >> "$GITHUB_OUTPUT"

  tests-cpu-ubuntu:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        pytorch-dtype: ["float32", "float64"]
        python-version: ["3.11", "3.12", "3.13"]
        pytorch-version: ["2.5.1", "2.6.0", "2.9.1", "2.14.0"]

    uses: ./.github/workflows/tests.yml
    with:
      os: "ubuntu-latest"
      python-version: '["${{ matrix.python-version }}"]'
      pytorch-version: '["${{ matrix.pytorch-version }}"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  tests-cpu-half-precision:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        pytorch-dtype: ["float16", "bfloat16"]
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      python-version: '["3.11"]'
      pytorch-version: '["2.9.1"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      known-failure-profile: cpu-${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  tests-cpu-windows:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]
        pytorch-dtype: ["float32", "float64"]
        python-version: ["3.11", "3.12", "3.13"]
        pytorch-version: ["2.5.1", "2.9.1", "2.14.0"]
        exclude:
          # PyTorch 2.5.1 doesn't have wheels for Python 3.13 on Windows
          - python-version: "3.13"
            pytorch-version: "2.5.1"
          # torch 2.5.1 wheels crash with STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on
          # the windows-2025 runner image; run those legs on windows-2022 instead.
          - os: windows-latest
            pytorch-version: "2.5.1"
        include:
          - os: windows-2022
            pytorch-dtype: "float32"
            python-version: "3.11"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float64"
            python-version: "3.11"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float32"
            python-version: "3.12"
            pytorch-version: "2.5.1"
          - os: windows-2022
            pytorch-dtype: "float64"
            python-version: "3.12"
            pytorch-version: "2.5.1"

    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: '["${{ matrix.python-version }}"]'
      pytorch-version: '["${{ matrix.pytorch-version }}"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  tests-cpu-mac:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        pytorch-dtype: ["float32", "float64"]
        python-version: ["3.11", "3.12", "3.13"]
        pytorch-version: ["2.5.1", "2.9.1", "2.14.0"]
        exclude:
          # PyTorch 2.5.1 doesn't have wheels for Python 3.13 on macOS
          - python-version: "3.13"
            pytorch-version: "2.5.1"
          # macOS only runs float32 tests
          - pytorch-dtype: "float64"

    uses: ./.github/workflows/tests.yml
    with:
      os: "macos-latest"
      python-version: '["${{ matrix.python-version }}"]'
      pytorch-version: '["${{ matrix.pytorch-version }}"]'
      pytorch-dtype: ${{ matrix.pytorch-dtype }}
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  coverage:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    uses: ./.github/workflows/coverage.yml
    with:
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-

  typing:
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip == 'false'
    uses: ./.github/workflows/typecheck.yml

  tutorials:
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip == 'false'
    uses: ./.github/workflows/tutorials.yml

  docs:
    needs: [check-skip, pre-tests]
    if: needs.check-skip.outputs.should-skip == 'false'
    uses: ./.github/workflows/docs.yml
    with:
      python-version: '["3.11"]'
      # Scheduled run on main: the model doctests download on a cache miss instead of
      # skipping, so main always exercises them for real.
      download-weights: true
      cache-path: weights/
      cache-key: model-weights-${{ needs.pre-tests.outputs.hash }}
      cache-restore-keys: |
        model-weights-${{ needs.pre-tests.outputs.hash }}
        model-weights-
