name: 🚀 Feature Request
description: Suggest an idea or new feature
title: "[Feature]: "
labels: ["feature request"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues first.

        Kornia is concentrating on its differentiable geometry / CV core and is not looking
        for new features in general; new model integrations are frozen. Describe a concrete workflow
        below. Please do not open a pull request, even a draft, until a maintainer has agreed
        to the scope on this issue; no reply means no agreement. See
        [CONTRIBUTING.md](https://github.com/kornia/kornia/blob/main/CONTRIBUTING.md#practical-guidelines).

  - type: textarea
    id: what-and-why
    attributes:
      label: What did you try, and where did it fall short?
      description: Who is trying to do what with the current kornia API, what did they try, and where does it fall short? A link to a user report is enough.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Sketch of the API or approach (optional)
      description: If you have an idea how it could look — a function signature, a reference implementation or paper — put it here.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Alternatives you considered, use cases, references, mockups.
    validations:
      required: false
