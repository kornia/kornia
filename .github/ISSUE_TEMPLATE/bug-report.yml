name: 🐛 Bug Report
description: Something is broken or gives wrong results
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please search existing issues first.

        If you want to investigate or fix it yourself, you are welcome to send a pull
        request. A small reproduction and a regression test are especially helpful.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Include the error message if there is one.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that shows the problem. This is the single most useful thing you can give us.
      placeholder: |
        import torch
        import kornia
        # ...
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        This command reports the versions and compute backend that usually matter without
        collecting usernames, paths, environment variables, or hostnames:
        ```
        python -c "import kornia, platform, sys, torch; gpu=torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none'; print(f'kornia {kornia.__version__} | torch {torch.__version__} | python {sys.version.split()[0]} | OS {platform.system()} {platform.release()} | CUDA {torch.version.cuda} (available={torch.cuda.is_available()}, GPU={gpu}) | MPS={torch.backends.mps.is_available()}')"
        ```
        Preview and redact any other diagnostic output before posting it. Do not share
        usernames, home or project paths, tokens, internal hostnames, or private data names.
      value: |
        - Kornia version:
        - PyTorch version:
        - Python version:
        - OS / device (CPU, CUDA, MPS):
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Screenshots, related issues, suspicions about the cause — anything that helps.
    validations:
      required: false
